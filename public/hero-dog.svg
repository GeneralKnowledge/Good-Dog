<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" fill="none" aria-hidden="true">
  <!-- soft ground, full bleed -->
  <path d="M0 250c70-34 140-34 210 0s140 34 210 0 140-34 220 0v70H0v-70z" fill="#2f6f5e" fill-opacity="0.14"/>
  <path d="M0 270c90-20 180-20 270 0s180 20 270 0 90-10 100 0v50H0v-50z" fill="#1f4f43" fill-opacity="0.1"/>

  <!-- sitting dog, clearer silhouette -->
  <g fill="#1f4f43">
    <!-- body -->
    <ellipse cx="300" cy="210" rx="78" ry="52" fill-opacity="0.88"/>
    <!-- chest / front -->
    <ellipse cx="250" cy="220" rx="42" ry="48" fill-opacity="0.88"/>
    <!-- head -->
    <ellipse cx="218" cy="148" rx="38" ry="36" fill-opacity="0.9"/>
    <!-- snout -->
    <ellipse cx="186" cy="158" rx="22" ry="16" fill-opacity="0.9"/>
    <!-- nose -->
    <ellipse cx="170" cy="156" rx="7" ry="5" fill="#0f2e27" fill-opacity="0.95"/>
    <!-- ear (floppy) -->
    <path d="M232 120c18-28 42-30 48-12 4 14-8 28-24 34-18 6-30-2-24-22z" fill-opacity="0.85"/>
    <!-- eye -->
    <circle cx="210" cy="142" r="4.5" fill="#0f2e27"/>
    <!-- front legs -->
    <rect x="228" y="240" width="16" height="42" rx="8" fill-opacity="0.85"/>
    <rect x="258" y="242" width="16" height="40" rx="8" fill-opacity="0.85"/>
    <!-- back leg / haunch -->
    <ellipse cx="340" cy="230" rx="28" ry="36" fill-opacity="0.82"/>
    <rect x="348" y="248" width="16" height="36" rx="8" fill-opacity="0.85"/>
    <!-- tail curve -->
    <path d="M370 190c28-8 44 10 40 34-2 12-12 18-20 12-6-4-4-14 2-18 6-4 4-16-8-18-10-2-16 2-14-10z" fill-opacity="0.8"/>
    <!-- collar accent -->
    <path d="M198 172c18 10 38 12 56 4" stroke="#c47a2c" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>

  <!-- treat -->
  <g transform="translate(420 150)">
    <circle r="14" fill="#c47a2c"/>
    <circle r="6" fill="#f8efe4" fill-opacity="0.9"/>
  </g>
</svg>
